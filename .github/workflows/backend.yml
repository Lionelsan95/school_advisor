name: Backend quality gates

on:
  pull_request:
  push:
    # This repository's default branch is `master`; `main` is listed too so a
    # future rename does not silently stop running the quality gates.
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: back

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: schools_app
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: schools_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U schools_app -d schools_db_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://schools_app:ci_test_password@localhost:5432/schools_db_test
      TEST_DATABASE_URL: postgresql://schools_app:ci_test_password@localhost:5432/schools_db_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: back/pyproject.toml

      - name: Install backend and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Upgrade disposable database to migration head
        run: python -m alembic upgrade head

      - name: Run full test suite, including neutrality regressions
        run: python -m pytest -ra

      - name: Lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Type-check application code
        run: python -m mypy src
