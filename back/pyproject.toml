[project]
name = "etablissements-en-clair-backend"
version = "0.1.0"
description = "Public-data explainer for French school establishments — backend"
requires-python = ">=3.12"

# Deliberately small. Every dependency here earns its place; see
# docs/02_Architecture_Decisions.md on resisting premature complexity.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # psycopg 3 with raw parameterized SQL. No ORM: the schema is four tables
    # and the queries are simple. An ORM would add indirection without
    # removing any real work at this volume (~68k rows).
    "psycopg[binary,pool]>=3.2",
    # Alembic is used for DDL migrations only (Core, no ORM models).
    "alembic>=1.14",
    "httpx>=0.28",
    # In-process scheduler for the ingestion job — no separate service, per
    # the architecture decision.
    "apscheduler>=3.11",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: requires a live database (deselect with '-m \"not integration\"')",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true
